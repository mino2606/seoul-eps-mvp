  {id:'l1',cat:'listening',diff:1,qtype:'그림/사진 (물건)',setNo:1,script:'여자: 이것은 무엇입니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['안전화입니다','안전모입니다','보안경입니다','안전 장갑입니다'],correct:1,explanation:'(스크립트 설명: \'이것은 안전모입니다\'라는 답을 유도합니다.)',keywords:[]},
  {id:'l2',cat:'listening',diff:1,qtype:'그림/사진 (장소)',setNo:1,script:'여자: 여기는 어디입니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['사무실입니다','식당입니다','창고입니다','공장입니다'],correct:2,explanation:'(스크립트 설명: \'여기는 창고입니다\'라는 답을 유도합니다.)',keywords:[]},
  {id:'l3',cat:'listening',diff:1,qtype:'그림/사진 (동작)',setNo:1,script:'남자: 남자는 무엇을 하고 있습니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['짐을 나르고 있습니다','기계를 조립하고 있습니다','톱으로 나무를 자르고 있습니다','전선을 연결하고 있습니다'],correct:0,explanation:'(스크립트 설명: \'짐을 나르고 있습니다\'라는 답을 유도합니다.)',keywords:[]},
  {id:'l4',cat:'listening',diff:1,qtype:'이어질 말',setNo:1,script:'남자: 퇴근 시간 다 됐어요.',text:'여자: (이어질 말은 무엇입니까?)',choices:['네, 아직 일하고 있어요','네, 좀 더 일해야 해요','네, 이제 정리하고 나갈게요','네, 퇴근 시간에 맞춰서 오세요'],correct:2,explanation:'퇴근 시간이 되었으므로, 이제 정리하고 퇴근하겠다는 말이 자연스럽습니다.',keywords:[]},
  {id:'l5',cat:'listening',diff:2,qtype:'이어질 말',setNo:1,script:'여자: 반장님, 드릴이 고장 났는데 어떻게 해야 할까요?',text:'남자: (이어질 말은 무엇입니까?)',choices:['고장 나지 않도록 조심하세요','제가 고칠 수 있을 거예요','전원 끄고 안전팀에 연락하세요','고장 난 드릴은 버려도 돼요'],correct:2,explanation:'기계 고장 시 임의 수리보다 안전 조치 후 보고가 원칙입니다.',keywords:[]},
  {id:'l6',cat:'listening',diff:1,qtype:'중심 내용',setNo:1,script:'남자: 오늘 작업은 여기까지 끝냅시다. 내일은 오전 8시부터 다시 시작할 거예요.',text:'여자: (들은 내용의 중심 생각은 무엇입니까?)',choices:['작업 시간을 늘리는 것','내일 작업 계획을 확인하는 것','오늘 작업을 마무리하는 것','작업 도구를 정리하는 것'],correct:2,explanation:'남자의 말은 오늘 작업 종료를 알리는 것이 핵심입니다.',keywords:[]},
  {id:'l7',cat:'listening',diff:2,qtype:'내용 일치',setNo:1,script:'여자: 안전모를 꼭 쓰세요. 머리를 보호하는 데 중요해요. / 남자: 네, 알겠습니다.',text:'(들은 내용과 같은 것을 고르십시오.)',choices:['여자는 안전모를 찾고 있다','남자는 안전모를 착용해야 한다','안전모는 손을 보호하는 데 필요하다','여자가 남자에게 안전모를 주었다'],correct:1,explanation:'여자가 남자에게 안전모 착용을 지시했으므로 남자는 착용해야 합니다.',keywords:[]},
  {id:'l8',cat:'listening',diff:2,qtype:'대화 목적',setNo:1,script:'남자: 이 제품은 포장이 잘 되어 있는지 확인해 주세요. 조금이라도 찢어지면 안 됩니다. / 여자: 네, 알겠습니다.',text:'(두 사람의 대화 목적으로 알맞은 것은 무엇입니까?)',choices:['제품의 재료를 확인하려고','제품의 무게를 측정하려고','제품의 포장 상태를 점검하려고','제품을 어디에 보관할지 물어보려고'],correct:2,explanation:'찢어지지 않았는지 **확인(점검)**하는 것이 주된 목적입니다.',keywords:[]},
  {id:'l9',cat:'listening',diff:1,qtype:'대화 장소',setNo:1,script:'남자: 몇 시에 예약하셨어요? / 여자: 3시에 했어요. 감기 때문에 목이 너무 아파요. / 남자: 네, 잠깐만 기다리세요.',text:'(두 사람이 이야기하는 장소는 어디입니까?)',choices:['우체국','약국','병원','시장'],correct:2,explanation:'예약, 감기, 아픔 등의 단어는 병원과 관련됩니다.',keywords:[]},
  {id:'l10',cat:'listening',diff:2,qtype:'대화 주제',setNo:1,script:'여자: 불이 났을 때는 비상벨을 누르고 소화기로 불을 꺼야 해요. / 남자: 만약 불이 안 꺼지면 바로 대피해야죠?',text:'(두 사람이 이야기하는 주제는 무엇입니까?)',choices:['작업 도구 사용법','화재 발생 시 대처 방법','기계 고장 수리 방법','응급 처치 요령'],correct:1,explanation:'비상벨, 소화기, 대피 등 화재 상황에 대한 이야기를 나누고 있습니다.',keywords:[]},
  {id:'l11',cat:'listening',diff:3,qtype:'대화 내용 (시간)',setNo:1,script:'남자: 내일은 오전 8시에 작업 시작입니다. 늦지 않도록 7시 30분까지 출근해 주세요. / 여자: 네, 늦지 않게 미리 도착하겠습니다.',text:'(들은 내용으로 맞는 것을 고르십시오.)',choices:['작업은 오전 7시 30분에 시작한다.','여자는 7시 30분까지 출근해야 한다.','남자는 오늘 8시에 퇴근할 것이다.','두 사람은 내일 늦게 만날 것이다.'],correct:1,explanation:'8시 작업 시작을 위해 7시 30분까지 출근해야 한다고 지시했습니다.',keywords:[]},
  {id:'l12',cat:'listening',diff:2,qtype:'대화 내용 (행동)',setNo:1,script:'여자: 안전모를 왜 안 쓰고 있어요? / 남자: 아, 깜빡했어요. 죄송합니다. 바로 쓸게요.',text:'(남자는 다음에 무슨 행동을 해야 합니까?)',choices:['안전모를 착용해야 합니다','작업을 멈춰야 합니다','반장님께 보고해야 합니다','기계를 닦아야 합니다'],correct:0,explanation:'남자가 **\'바로 쓸게요\'**라고 말했으므로, 안전모를 착용하는 행동이 이어집니다.',keywords:[]},
  {id:'l13',cat:'listening',diff:2,qtype:'정보 파악 (표)',setNo:1,script:'남자: 우리 회사에서는 매달 10일에 월급을 주고 있습니다.',text:'(들은 내용과 같은 것을 고르십시오. ※ 표: 월급 지급일 10일)',choices:['월급을 주 1회 지급한다','월급은 매월 10일에 지급된다','10일에 휴가를 갈 수 있다','월급을 매년 지급한다'],correct:1,explanation:'스크립트와 표 내용(매달 10일)이 일치합니다.',keywords:[]},
  {id:'l14',cat:'listening',diff:3,qtype:'정보 파악 (번호)',setNo:1,script:'여자: 한국에서 화재나 응급 환자가 발생하면 119로 신고해야 합니다.',text:'(들은 내용과 같은 것을 고르십시오. ※ 표: 응급 상황 시 신고 번호 119)',choices:['회사에 일이 생기면 119에 전화한다','불이 났을 때 119로 신고해야 한다','119는 경찰서 전화번호이다','전화번호를 외울 필요가 없다'],correct:1,explanation:'119는 화재/응급 신고 번호입니다.',keywords:[]},
  {id:'l15',cat:'listening',diff:3,qtype:'정보 파악 (순서)',setNo:1,script:'남자: 공구 사용 순서를 알려 드릴게요. 먼저 사용할 공구를 고르고, 다음으로 안전 장갑을 착용합니다. 마지막으로 사용 후에는 공구를 정리하세요.',text:'(들은 내용으로 맞는 것을 고르십시오.)',choices:['안전 장갑 착용이 공구 선택보다 나중이다','공구를 정리하는 것이 가장 첫 번째이다','공구를 고르기 전에 안전 장갑을 껴야 한다','공구를 사용한 후에 안전 장갑을 벗는다'],correct:0,explanation:'스크립트에서 **\'먼저 공구를 고르고, 다음으로 장갑을 착용한다\'**고 했으므로 (1)이 맞습니다.',keywords:[]},
  {id:'l16',cat:'listening',diff:1,qtype:'이야기 듣고 질문 (장소)',setNo:1,script:'여자: 저는 퇴근 후에 기숙사에 있는 식당에 갑니다. 동료들과 같이 밥을 먹고 방으로 돌아와서 쉽니다.',text:'(여자는 퇴근 후에 어디에 갑니까?)',choices:['공장','식당','사무실','병원'],correct:1,explanation:'여자가 식당에 간다고 직접 말했습니다.',keywords:[]},
  {id:'l17',cat:'listening',diff:2,qtype:'이야기 듣고 질문 (이유)',setNo:1,script:'남자: 오늘은 비가 와서 길이 미끄러울 것 같습니다. 그래서 평소보다 천천히 운전해야 안전합니다.',text:'(남자가 천천히 운전해야 하는 이유는 무엇입니까?)',choices:['길이 복잡해서','비가 와서 길이 미끄러워서','차가 너무 빨라서','퇴근 시간이 늦어서'],correct:1,explanation:'비가 와서 길이 미끄러운 것이 이유입니다.',keywords:[]},
  {id:'l18',cat:'listening',diff:2,qtype:'이야기 듣고 질문 (내용 일치)',setNo:1,script:'여자: 저는 한국어를 잘하고 싶어서 매일 2시간씩 공부합니다. 처음에는 어려웠지만, 지금은 간단한 대화는 할 수 있습니다.',text:'(들은 내용과 같은 것을 고르십시오.)',choices:['한국어 공부는 재미없다','여자는 한국어를 열심히 공부한다','여자는 한국어를 아주 잘한다','여자는 한국어 공부를 시작하지 않았다'],correct:1,explanation:'매일 2시간씩 공부한다고 했으므로 열심히 공부하고 있습니다.',keywords:[]},
  {id:'l19',cat:'listening',diff:3,qtype:'이야기 듣고 질문 (다음 행동)',setNo:1,script:'남자: 작업 중 기계에서 이상한 소리가 났습니다. 저는 바로 기계의 전원을 끄고 반장님께 보고했습니다.',text:'(남자가 다음에 할 행동으로 알맞은 것은 무엇입니까?)',choices:['반장님의 지시에 따라 수리한다','이상한 소리가 나는 기계를 버린다','동료들에게 기계 고장 사실을 알린다','혼자서 기계를 고치려고 한다'],correct:0,explanation:'반장에게 보고했으므로 반장님의 지시를 따르는 것이 다음 행동입니다.',keywords:[]},
  {id:'l20',cat:'listening',diff:3,qtype:'이야기 듣고 질문 (주제)',setNo:1,script:'여자: 작업복은 안전을 위해 반드시 입어야 합니다. 작업복에 찢어진 부분이 있으면 큰 사고가 날 수 있으니 바로 반장님께 말해서 바꿔야 합니다.',text:'(여자가 이야기하는 중심 내용은 무엇입니까?)',choices:['작업복을 입지 않아도 된다','작업복 관리의 중요성','작업복의 종류','작업복을 사는 방법'],correct:1,explanation:'안전을 위해 반드시 입고, 찢어지면 바꿔야 한다는 것은 작업복 관리의 중요성을 강조하는 내용입니다.',keywords:[]},
  {id:'l21',cat:'listening',diff:1,qtype:'그림/사진 (도구)',setNo:2,script:'남자: 이것은 무엇입니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['장갑입니다','보안경입니다','마스크입니다','안전화입니다'],correct:3,explanation:'(스크립트 설명: \'이것은 안전화입니다\'라는 답을 유도합니다.)',keywords:[]},
  {id:'l22',cat:'listening',diff:1,qtype:'그림/사진 (장소)',setNo:2,script:'여자: 여기는 어디입니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['기숙사입니다','주차장입니다','사무실입니다','휴게실입니다'],correct:1,explanation:'(스크립트 설명: \'여기는 주차장입니다\'라는 답을 유도합니다.)',keywords:[]},
  {id:'l23',cat:'listening',diff:1,qtype:'그림/사진 (동작)',setNo:2,script:'남자: 여자는 무엇을 하고 있습니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['용접을 하고 있습니다','페인트를 칠하고 있습니다','전선을 자르고 있습니다','나사를 조이고 있습니다'],correct:0,explanation:'(스크립트 설명: \'용접을 하고 있습니다\'라는 답을 유도합니다.)',keywords:[]},
  {id:'l24',cat:'listening',diff:2,qtype:'이어질 말',setNo:2,script:'여자: 오늘 야근해야 하는데, 괜찮으시겠어요?',text:'남자: (이어질 말은 무엇입니까?)',choices:['네, 야근이 싫어요','네, 지금 퇴근할게요','네, 일이 많아서 해야 할 것 같아요','아니요, 일찍 출근하겠습니다'],correct:2,explanation:'야근 여부를 물었으므로, 일이 많아서 야근을 하겠다는 긍정의 답변이 자연스럽습니다.',keywords:[]},
  {id:'l25',cat:'listening',diff:2,qtype:'이어질 말',setNo:2,script:'남자: 반장님, 작업할 때 소리가 너무 커서 귀가 아파요.',text:'여자: (이어질 말은 무엇입니까?)',choices:['소리를 더 크게 하세요','지금 바로 귀마개를 착용하세요','소리가 크면 빨리 도망가세요','작업을 멈추지 마세요'],correct:1,explanation:'소음으로 인한 통증이 있으므로, 귀를 보호하기 위한 귀마개 착용을 지시하는 것이 적절합니다.',keywords:[]},
  {id:'l26',cat:'listening',diff:1,qtype:'중심 내용',setNo:2,script:'남자: 작업이 끝난 후에는 사용한 공구를 제자리에 정리해야 합니다. 그래야 다음 작업에 문제가 없습니다.',text:'여자: (들은 내용의 중심 생각은 무엇입니까?)',choices:['공구를 새로 구입하는 것','공구 정리의 중요성','작업 시간을 줄이는 것','공구 사용법을 배우는 것'],correct:1,explanation:'공구를 정리해야 하는 이유를 설명하고 있으므로, 공구 정리의 중요성이 핵심입니다.',keywords:[]},
  {id:'l27',cat:'listening',diff:2,qtype:'내용 일치',setNo:2,script:'여자: 이번 달부터 외국인 근로자는 기숙사 식비를 따로 내지 않아도 됩니다. / 남자: 정말요? 부담이 줄겠네요.',text:'(들은 내용과 같은 것을 고르십시오.)',choices:['남자는 식비가 비싸다고 생각한다','외국인 근로자는 식비를 내지 않는다','기숙사 식당이 문을 닫았다','식비는 다음 달부터 내야 한다'],correct:1,explanation:'\'따로 내지 않아도 된다\'고 했으므로 식비가 면제된다는 뜻입니다.',keywords:[]},
  {id:'l28',cat:'listening',diff:2,qtype:'대화 목적',setNo:2,script:'남자: 비행기표를 취소하려고 하는데, 어떻게 해야 하나요? / 여자: 예약 번호와 신분증을 보여 주세요.',text:'(두 사람의 대화 목적으로 알맞은 것은 무엇입니까?)',choices:['항공사 정보를 확인하려고','비행기표 취소 방법을 문의하려고','비행기표를 새로 예약하려고','신분증을 재발급받으려고'],correct:1,explanation:'비행기표 취소 방법을 물어보고 있습니다.',keywords:[]},
  {id:'l29',cat:'listening',diff:1,qtype:'대화 장소',setNo:2,script:'여자: 이 옷은 언제까지 수선이 될까요? / 남자: 바지는 내일 오후 3시, 셔츠는 모레 오전 10시에 찾으러 오세요.',text:'(두 사람이 이야기하는 장소는 어디입니까?)',choices:['편의점','백화점','세탁소/수선집','우체국'],correct:2,explanation:'옷, 수선, 찾으러 오세요 등의 단어는 세탁소 또는 수선집과 관련됩니다.',keywords:[]},
  {id:'l30',cat:'listening',diff:2,qtype:'대화 주제',setNo:2,script:'남자: 공장에 불이 나면 소화기를 사용해야 합니다. 소화기는 여기에 있습니다. / 여자: 네, 사용법도 미리 숙지해야겠어요.',text:'(두 사람이 이야기하는 주제는 무엇입니까?)',choices:['기계 작동 순서','화재 예방 및 대처','작업 보고서 작성 방법','응급 상황 시 구급대 연락'],correct:1,explanation:'소화기 사용법과 위치는 화재 예방 및 대처와 관련됩니다.',keywords:[]},
  {id:'l31',cat:'listening',diff:3,qtype:'대화 내용 (시간)',setNo:2,script:'여자: 은행은 오전 9시부터 오후 4시까지 영업합니다. 제가 3시에 끝날 것 같으니 늦지 않게 가야겠어요. / 남자: 네, 늦으면 영업을 안 하니까 서두르세요.',text:'(들은 내용으로 맞는 것을 고르십시오.)',choices:['은행은 오전 4시에 닫는다.','여자는 4시 이전에 은행에 가야 한다.','남자는 은행에 갈 필요가 없다.','은행 영업 시간은 9시간이다.'],correct:1,explanation:'은행이 4시에 닫으므로, 3시에 일이 끝나는 여자는 4시 이전에 가야 합니다.',keywords:[]},
  {id:'l32',cat:'listening',diff:2,qtype:'대화 내용 (행동)',setNo:2,script:'남자: 이 약은 하루 세 번, 식사 후에 드셔야 합니다. / 여자: 네, 알겠습니다.',text:'(여자는 다음에 무슨 행동을 해야 합니까?)',choices:['약을 먹지 않아도 됩니다','식사 후에 약을 먹어야 합니다','하루 한 번만 먹어야 합니다','약을 버려야 합니다'],correct:1,explanation:'약사가 지시한 대로 식사 후 하루 세 번 복용하는 행동을 해야 합니다.',keywords:[]},
  {id:'l33',cat:'listening',diff:2,qtype:'정보 파악 (표)',setNo:2,script:'여자: 버스 요금은 성인은 1,200원, 어린이는 600원입니다.',text:'(들은 내용과 같은 것을 고르십시오. ※ 표: 성인 1,200원, 어린이 600원)',choices:['성인과 어린이의 요금은 같다','성인 요금이 어린이 요금보다 비싸다','버스 요금은 모두 600원이다','버스 요금은 1,000원이다'],correct:1,explanation:'성인(1,200원)이 어린이(600원)보다 비쌉니다.',keywords:[]},
  {id:'l34',cat:'listening',diff:3,qtype:'정보 파악 (기간)',setNo:2,script:'남자: 공사 기간은 4월 1일부터 4월 30일까지 한 달입니다. 이 기간에는 이 길을 이용할 수 없습니다.',text:'(들은 내용과 같은 것을 고르십시오. ※ 표: 공사 기간 4월 1일 ~ 4월 30일)',choices:['공사는 4월 말에 시작한다','공사는 하루 동안 진행된다','공사가 진행되는 동안 길을 이용할 수 없다','공사는 5월 1일에 끝난다'],correct:2,explanation:'공사 기간 동안 길을 이용할 수 없다고 했습니다.',keywords:[]},
  {id:'l35',cat:'listening',diff:3,qtype:'정보 파악 (순서)',setNo:2,script:'여자: 소화기 사용법입니다. 먼저 안전핀을 뽑고, 노즐을 잡고 불이 난 곳을 향합니다. 마지막으로 손잡이를 꽉 움켜쥐어 분사합니다.',text:'(들은 내용으로 맞는 것을 고르십시오.)',choices:['안전핀을 뽑는 것이 가장 첫 번째 행동이다','불이 난 곳을 향하기 전에 분사해야 한다','노즐은 잡지 않아도 된다','손잡이를 움켜쥐는 것이 가장 먼저이다'],correct:0,explanation:'스크립트에서 **\'먼저 안전핀을 뽑고\'**라고 명시했습니다.',keywords:[]},
  {id:'l36',cat:'listening',diff:1,qtype:'이야기 듣고 질문 (대상)',setNo:2,script:'남자: 제가 사는 기숙사에는 세탁기가 2대 있습니다. 세탁기가 많지 않아서 다른 사람과 시간을 맞춰서 사용해야 합니다.',text:'(남자가 사는 기숙사에 있는 것은 무엇입니까?)',choices:['냉장고','컴퓨터','세탁기','TV'],correct:2,explanation:'남자가 세탁기가 2대 있다고 직접 말했습니다.',keywords:[]},
  {id:'l37',cat:'listening',diff:2,qtype:'이야기 듣고 질문 (이유)',setNo:2,script:'여자: 저는 오늘 몸이 안 좋아서 병원에 갔습니다. 의사 선생님이 약을 먹고 푹 쉬라고 했습니다.',text:'(여자가 병원에 간 이유는 무엇입니까?)',choices:['회사에 늦어서','몸이 안 좋아서','약을 사러','친구를 만나러'],correct:1,explanation:'여자가 몸이 안 좋아서 병원에 갔다고 직접 말했습니다.',keywords:[]},
  {id:'l38',cat:'listening',diff:2,qtype:'이야기 듣고 질문 (내용 일치)',setNo:2,script:'남자: 저희 공장은 화재 예방을 위해 매달 소방 훈련을 실시합니다. 훈련에 빠지지 않고 참여해야 안전에 익숙해질 수 있습니다.',text:'(들은 내용과 같은 것을 고르십시오.)',choices:['소방 훈련은 필요 없다','매달 소방 훈련을 하고 있다','훈련에 참여할 필요는 없다','소방 훈련은 1년에 한 번 한다'],correct:1,explanation:'매달 소방 훈련을 실시한다고 명시했습니다.',keywords:[]},
  {id:'l39',cat:'listening',diff:3,qtype:'이야기 듣고 질문 (다음 행동)',setNo:2,script:'여자: 저는 작업 중 다쳤습니다. 바로 상처를 확인하고, 상처가 깊지 않아 약을 바르고 밴드를 붙였습니다. / 남자: (여자가 다음에 할 행동으로 알맞은 것은 무엇입니까?)',text:'상처 부위를 물에 담근다',choices:['무거운 짐을 다시 든다','반장님께 부상 사실을 보고한다','상처에 밴드를 붙이지 않는다','다시 작업을 진행한다'],correct:2,explanation:'상처에 대한 응급처치를 했더라도 부상 사실을 보고하는 것이 다음 행동이자 원칙입니다.',keywords:[]},
  {id:'l40',cat:'listening',diff:3,qtype:'이야기 듣고 질문 (주제)',setNo:2,script:'남자: 한국 생활이 편해지려면 한국어를 꾸준히 배워야 합니다. 일할 때도 도움이 되고, 친구를 사귀는 데도 큰 도움이 됩니다.',text:'(남자가 이야기하는 중심 내용은 무엇입니까?)',choices:['한국 친구를 사귀는 방법','한국어 학습의 필요성','한국의 문화 체험','쉬는 시간을 활용하는 방법'],correct:1,explanation:'한국 생활에 도움이 된다는 것은 한국어 학습의 필요성을 강조하는 내용입니다.',keywords:[]},
  {id:'l41',cat:'listening',diff:1,qtype:'그림/사진 (도구)',setNo:3,script:'여자: 이것은 무엇입니까?',text:'들은 내용과 같은 것을 고르십시오.',choices:['장갑입니다','망치입니다','톱입니다','드라이버입니다'],correct:2,explanation:'(스크립트 설명: \'이것은 톱입니다\'라는 답을 유도합니다.)',keywords:[]},

  {id:'l46',cat:'listening',diff:1,qtype:'중심 내용',setNo:3,script:'남자: 공장에서 일할 때는 반드시 안전모를 착용해야 합니다. 작은 충격에도 머리를 보호할 수 있습니다.',text:'여자: (들은 내용의 중심 생각은 무엇입니까?)',choices:['공장 작업 환경 개선','작업복 착용의 중요성','안전모 착용의 필요성','공구 사용법 교육'],correct:2,explanation:'안전모를 반드시 착용해야 하는 이유(머리 보호)를 설명하고 있습니다.',keywords:[]},

  {id:'l48',cat:'listening',diff:2,qtype:'대화 목적',setNo:3,script:'남자: 이 비닐 포장지는 한 번 사용하고 버려야 합니다. / 여자: 네, 알겠습니다.',text:'(두 사람의 대화 목적으로 알맞은 것은 무엇입니까?)',choices:['포장지 가격을 확인하려고','포장지 재사용 여부를 알려 주려고','포장지의 재료를 물어보려고','포장지를 새로 구입하려고'],correct:1,explanation:'**\'한 번 사용하고 버려야 한다\'**는 것은 재사용이 불가능함을 알려주는 목적입니다.',keywords:[]},
  {id:'l49',cat:'listening',diff:1,qtype:'대화 장소',setNo:3,script:'여자: 여권과 비행기표를 보여 주십시오. / 남자: 여기 있습니다. 짐은 몇 개 맡기시겠어요?',text:'(두 사람이 이야기하는 장소는 어디입니까?)',choices:['기차역','호텔','공항','은행'],correct:2,explanation:'여권, 비행기표, 짐 등의 단어는 **공항(체크인 카운터)**과 관련됩니다.',keywords:[]},
  {id:'l50',cat:'listening',diff:2,qtype:'대화 주제',setNo:3,script:'남자: 작업 중에는 무거운 물건을 들 때 허리를 다칠 수 있으니 조심해야 합니다. / 여자: 네, 허리 보호대도 착용하는 것이 좋겠어요.',text:'(두 사람이 이야기하는 주제는 무엇입니까?)',choices:['허리 부상 예방','무거운 짐을 드는 방법','보호 장구의 종류','작업 순서의 중요성'],correct:0,explanation:'무거운 물건을 들 때 허리를 다칠 수 있다고 경고하며, 허리 보호대 착용을 언급하는 것은 부상 예방에 대한 이야기입니다.',keywords:[]},
  {id:'l51',cat:'listening',diff:3,qtype:'대화 내용 (물건)',setNo:3,script:'여자: 이 드릴은 힘이 약해서 철판을 뚫기 어렵습니다. 더 큰 드릴로 바꿔야 할 것 같아요. / 남자: 네, 알겠습니다.',text:'(들은 내용으로 맞는 것을 고르십시오.)',choices:['남자는 드릴이 필요하다','현재 사용하는 드릴은 성능이 약하다','드릴은 철판을 뚫지 않아도 된다','여자는 작은 드릴로도 충분하다'],correct:1,explanation:'힘이 약해서 뚫기 어렵다고 했으므로 현재 드릴의 성능이 약한 것이 맞습니다.',keywords:[]},

  {id:'l53',cat:'listening',diff:2,qtype:'정보 파악 (표)',setNo:3,script:'여자: 점심 시간은 12시 30분부터 1시 30분까지 한 시간입니다.',text:'(들은 내용과 같은 것을 고르십시오. ※ 표: 점심 시간 12:30 ~ 13:30)',choices:['점심 시간은 2시간이다','점심 시간은 1시간이다','1시에 점심 시간이 끝난다','12시에 점심 시간이 시작된다'],correct:1,explanation:'12시 30분부터 1시 30분까지는 1시간입니다.',keywords:[]},

  {id:'l55',cat:'listening',diff:3,qtype:'정보 파악 (순서)',setNo:3,script:'여자: 이 서류는 작성 후에 반장님께 먼저 드리고, 다음으로 사장님의 서명을 받아야 합니다.',text:'(들은 내용으로 맞는 것을 고르십시오.)',choices:['사장님의 서명을 먼저 받아야 한다','반장님께 서류를 드리는 것이 먼저이다','서류는 작성하지 않아도 된다','반장님과 사장님께 동시에 서류를 드린다'],correct:1,explanation:'**\'반장님께 먼저 드리고\'**라고 명시했으므로 반장님께 드리는 것이 순서상 첫 번째입니다.',keywords:[]},

// STATE
// ════════════════════════════════════════════════════════
let S = {
  lang: 'en', user: null,
  diagQs: [], diagAnswers: [], diagIdx: 0, diagSel: null,
  diagTimerSec: 0, diagTimerRef: null,
  diagResult: null,
  quizQs: [], quizAnswers: [], quizIdx: 0, quizSel: null,
  quizAnswered: false, quizCorrect: 0,
  progress: [],
  // adaptive: track wrong counts per question id
  wrongCounts: {},
  // today carousel + flip mode
  todayIdx: 0, flipMode: false,
};

function persist() {
  try {
    localStorage.setItem('seouleps', JSON.stringify({
      lang: S.lang, user: S.user, progress: S.progress,
      wrongCounts: S.wrongCounts,
      diagDone: S.progress.length > 0,
      settings: S.settings, vocab: S.vocab,
      customContent: S.customContent, diagResult: S.diagResult,
    }));
  } catch(e) {}
}

function hydrate() {
  try {
    const raw = localStorage.getItem('seouleps');
    if (raw) {
      const d = JSON.parse(raw);
      S.lang = d.lang || 'en';
      S.user = d.user || null;
      S.progress = d.progress || [];
      S.wrongCounts = d.wrongCounts || {};
      S.settings = d.settings || { darkMode:false, dailyGoal:10, notif:false };
      S.vocab = d.vocab || { learned:{} };
      S.customContent = d.customContent || { questions:[], words:[] };
      S.diagResult = d.diagResult || null;
      if (S.user && !S.user.avatar) S.user.avatar = '😀';
    } else {
      S.settings = { darkMode:false, dailyGoal:10, notif:false };
      S.vocab = { learned:{} };
      S.customContent = { questions:[], words:[] };
    }
  } catch(e) {}
  applyTheme();
}
function saveState() { try { persist(); } catch(e){} }

// ROUTING
// ════════════════════════════════════════════════════════
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('sc-' + id).classList.add('active');
}

function applyLang() {
  lang = S.lang;
  const _s = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  _s('diag-topbar-title', t('diagTitle'));
  _s('result-topbar-title', t('resultTitle'));
  _s('quiz-topbar-title', t('practiceTitle'));
  _s('report-topbar-title', t('reportTitle'));
  _s('report-back-lbl', t('reportBack'));
  _s('exit-title', t('exitTitle'));
  _s('exit-sub', t('exitSub'));
  _s('exit-confirm-btn', t('exitConfirm'));
  _s('exit-cancel-btn', t('exitCancel'));
}

// SPLASH
// ════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  hydrate();
  setTimeout(() => {
    applyLang();
    if (S.user && S.progress.length > 0) {
      renderHome(); show('home');

// ════════════════════════════════════════════════════════
// ADAPTIVE QUESTION POOL
// ════════════════════════════════════════════════════════
function shuffled(arr) { return [...arr].sort(() => Math.random() - .5); }

function buildAdaptivePool(category, count) {
  let pool = category === 'all' ? [...QS] : QS.filter(q => q.cat === category);
  // Weight questions: wrong questions appear more often
  let weighted = [];
  pool.forEach(q => {
    const w = 1 + (S.wrongCounts[q.id] || 0);
    for (let i = 0; i < w; i++) weighted.push(q);
  });
  weighted = shuffled(weighted);
  // Deduplicate while preserving weight-driven order
  const seen = new Set();
  const result = [];
  for (const q of weighted) {
    if (!seen.has(q.id)) { seen.add(q.id); result.push(q); }
    if (result.length >= count) break;
  }
  // Pad if pool too small
  if (result.length < count) {
    for (const q of shuffled(pool)) {
      if (!seen.has(q.id)) { seen.add(q.id); result.push(q); }
      if (result.length >= count) break;
    }
  }
  return result;
}

function recordAnswer(qid, isCorrect) {
  if (!isCorrect) {
    S.wrongCounts[qid] = (S.wrongCounts[qid] || 0) + 1;
  } else if (S.wrongCounts[qid] > 0) {
    S.wrongCounts[qid] = Math.max(0, S.wrongCounts[qid] - 1);
  }
}

function startDiagnosis() {
  // 진단 10문제: 어휘 4 + 읽기 3 + 듣기 3 (영역 균형)
  const byCat = (cat) => shuffled(QS.filter(q => q.cat === cat));
  const v = byCat('vocabulary').slice(0, 4);
  const r = byCat('reading').slice(0, 3);
  const l = byCat('listening').slice(0, 3);
  let picked = [...v, ...r, ...l];
  if (picked.length < 10) picked = picked.concat(shuffled(QS).slice(0, 10 - picked.length));
  S.diagQs = picked.slice(0, 10);
  S.diagAnswers = []; S.diagIdx = 0; S.diagSel = null;
  S.diagTimerSec = 0;
  clearInterval(S.diagTimerRef);
  S.diagTimerRef = setInterval(() => {
    S.diagTimerSec++;
    const m = String(Math.floor(S.diagTimerSec/60)).padStart(2,'0');
    const s = String(S.diagTimerSec%60).padStart(2,'0');
    document.getElementById('diag-timer').textContent = m+':'+s;
  }, 1000);
  renderDiagQ();
  show('diag');
}

function renderDiagQ() {
  const q = S.diagQs[S.diagIdx];
  const total = S.diagQs.length;
  const isLast = S.diagIdx === total - 1;
  document.getElementById('diag-counter').textContent = `${S.diagIdx+1}/${total}`;
  document.getElementById('diag-prog').style.width = `${(S.diagIdx+1)/total*100}%`;
  document.getElementById('diag-next-btn').textContent = isLast ? t('diagSubmit') : t('diagNext');
  document.getElementById('diag-next-btn').disabled = true;
  S.diagSel = null;

  const catBadge = { vocabulary:'badge-blue', reading:'badge-green', listening:'badge-amber' }[q.cat] || 'badge-blue';
  const catLabel = { vocabulary:t('catVocab'), reading:t('catRead'), listening:t('catListen') }[q.cat];

  let bodyHTML = `<span class="badge ${catBadge}">${catLabel}</span>`;
  if (q.cat === 'listening') {
    const audioText = q.script || q.audio || q.text || '';
    bodyHTML += `
      <p class="q-instruction">음성을 듣고 알맞은 답을 고르십시오.</p>
      <div class="passage-box" style="background:#FFF7ED;border-color:#FED7AA;display:flex;gap:10px;align-items:center;justify-content:center;">
        <button class="tts-btn" onclick="speakKo(\`${audioText.replace(/`/g,'').replace(/\\/g,'')}\`,false)">🔊 듣기</button>
        <button class="tts-btn" onclick="speakKo(\`${audioText.replace(/`/g,'').replace(/\\/g,'')}\`,true)">🐢 천천히</button>
      </div>
      <p class="q-helper">아래 보기에서 알맞은 것을 고르십시오.</p>`;
    bodyHTML += `<div id="diag-choices">${renderChoicesHTML(q, null, false)}</div>`;
    document.getElementById('diag-body').innerHTML = bodyHTML;
    if (audioText) setTimeout(()=>speakKo(audioText,false), 300);
    return;
  }
  const parsed = parseQuizText(q.text);
  if (parsed.instruction) bodyHTML += `<p class="q-instruction">${parsed.instruction}</p>`;
  bodyHTML += renderPassageHTML(parsed);
  bodyHTML += `<p class="q-helper">아래 보기에서 알맞은 것을 고르십시오.</p>`;
  bodyHTML += `<div id="diag-choices">${renderChoicesHTML(q, null, false)}</div>`;
  document.getElementById('diag-body').innerHTML = bodyHTML;
}

function renderChoicesHTML(q, sel, answered) {
  return q.choices.map((c, i) => {
    let cls = '';
    if (answered) { cls = i === q.correct ? 'right' : i === sel ? 'wrong' : ''; }
    else if (i === sel) cls = 'sel';
    let icon;
    if (answered) {
      icon = i === q.correct ? 'O' : i === sel ? 'X' : (i+1);
    } else {
      icon = i+1;
    }
    let judgeBadge = '';
    if (answered) {
      if (i === q.correct) judgeBadge = '<span class="choice-judge j-right">정답</span>';
      else if (i === sel) judgeBadge = '<span class="choice-judge j-wrong">오답</span>';
    }
    return `<div class="choice ${cls}" onclick="${answered?'':'selectDiag('+i+')'}"  style="${answered?'cursor:default':''}">
      <div class="choice-num">${icon}</div>
      <div class="choice-text">${fmtQText(c)}</div>
      ${judgeBadge}
    </div>`;
  }).join('');
}

function selectDiag(i) {
  S.diagSel = i;
  document.getElementById('diag-choices').innerHTML = renderChoicesHTML(S.diagQs[S.diagIdx], i, false);
  document.getElementById('diag-next-btn').disabled = false;
}

function diagNext() {
  S.diagAnswers.push(S.diagSel);
  if (S.diagIdx < S.diagQs.length - 1) {
    S.diagIdx++;
    renderDiagQ();
  } else {
    submitDiagnosis();
  }
}

function submitDiagnosis() {
  clearInterval(S.diagTimerRef);
  const qs = S.diagQs, as = S.diagAnswers;
  let score = 0;
  const catTotal = {}, catWrong = {};
  qs.forEach((q, i) => {
    catTotal[q.cat] = (catTotal[q.cat]||0)+1;
    const correct = as[i] === q.correct;
    if (correct) score++;
    else { catWrong[q.cat] = (catWrong[q.cat]||0)+1; recordAnswer(q.id, false); }
    if (correct) recordAnswer(q.id, true);
  });
  const sorted = Object.entries(catWrong).sort((a,b)=>b[1]-a[1]);
  const weakAreas = sorted.slice(0,2).map(([c])=>c);

  S.diagResult = { score, total: qs.length, answers: as, weakAreas: weakAreas.length ? weakAreas : [], timestamp: Date.now(), type: 'diagnosis' };
  S.progress.push(S.diagResult);
  persist();
  renderResult(S.diagResult);
  show('result');
}

function startQuiz(cat, label, mockId, seed, setNo) {
  // 진입 출처 기록 (X 버튼/완료 후 복귀용)
  const _prSc = document.getElementById('sc-practice');
  S.quizOrigin = (_prSc && _prSc.classList.contains('active')) ? 'practice' : 'home';

  // 시드 기반 고정 셔플 (모의고사) vs 적응형 (영역별)
  if (seed != null) {
    let pool = cat === 'all' ? [...QS] : QS.filter(q => q.cat === cat);
    // setNo 지정 시 해당 세트만 (듣기/읽기 세트별)
    if (setNo != null && setNo !== 'null') {
      pool = pool.filter(q => q.setNo === setNo);
      S.quizQs = pool;  // 세트는 그대로 순서 유지
    } else {
      const seeded = pool.slice().sort((a, b) => {
        const ha = (a.id + seed).split('').reduce((n,c)=>n+c.charCodeAt(0),0);
        const hb = (b.id + seed).split('').reduce((n,c)=>n+c.charCodeAt(0),0);
        return ha - hb;
      });
      S.quizQs = seeded.slice(0, 15);
    }
  } else {
    S.quizQs = buildAdaptivePool(cat, 15);
  }
  S.quizLabel  = label  || 'Practice';
  S.quizMockId = mockId || null;
  S.quizAnswers = []; S.quizIdx = 0;
  S.quizSel = null; S.quizAnswered = false; S.quizCorrect = 0;
  // topbar 타이틀 업데이트
  document.getElementById('quiz-topbar-title').textContent = S.quizLabel;
  renderQuizQ();
  show('quiz');
}

function fmtQText(s) {
  if (!s) return '';
  // "빈칸"을 시각적 ( ) 로 치환
  return String(s).replace(/빈칸/g, '<span class="q-blank">_____</span>');
}

function getPictogram(text) {
  const t = String(text || '');
  const map = [
    [/구내식당|식당.*표지판|식당/, '🍽️', '식당 표지판'],
    [/안전모|헬멧/, '⛑️', '안전모'],
    [/용접/, '🔥', '용접'],
    [/낚시/, '🎣', '낚시'],
    [/망치/, '🔨', '망치'],
    [/톱|나무를?\s*자르/, '🪚', '톱'],
    [/드라이버|나사/, '🪛', '드라이버'],
    [/사포/, '🧽', '사포'],
    [/보행\s*금지|걷지\s*마/, '🚷', '보행 금지'],
    [/위험|경고|주의/, '⚠️', '경고'],
    [/장갑/, '🧤', '장갑'],
    [/마스크/, '😷', '마스크'],
    [/보안경|고글/, '🥽', '보안경'],
    [/안전화/, '🥾', '안전화'],
    [/비행기|항공/, '✈️', '비행기'],
    [/지하철|버스|기차|역/, '🚉', '교통'],
    [/병원|의료|진료/, '🏥', '병원'],
    [/은행|저금|예금/, '🏦', '은행'],
    [/약국|약/, '💊', '약국'],
    [/우체국|편지/, '✉️', '우체국'],
    [/공장/, '🏭', '공장'],
    [/사무실/, '🏢', '사무실'],
    [/휴게실/, '🛋️', '휴게실'],
    [/기숙사|숙소/, '🏠', '기숙사'],
    [/주차장|자동차/, '🅿️', '주차장'],
    [/표|차트|그래프|월급|가격|일정/, '📊', '표/안내'],
    [/안내문|공지|게시|준비물/, '📋', '안내문'],
    [/달력|날짜/, '📅', '달력'],
    [/시계|시간/, '🕐', '시계'],
    [/음식|밥|먹/, '🍚', '음식'],
    [/물|음료/, '💧', '물'],
    [/책|교과서/, '📖', '책'],
  ];
  for (const [re, emoji, label] of map) {
    if (re.test(t)) return { emoji, label: t.length < 40 ? t : label };
  }
  return { emoji: '🖼️', label: t };
}

function parseQuizText(rawText) {
  // 반환: { instruction, passageType: 'visual'|'text'|'inline'|'none', passage, question }
  if (!rawText) return { instruction:'', passageType:'none', passage:'', question:'' };
  let s = String(rawText).trim();

  // 1) "(※ ...)" 또는 "(※...)" 패턴 → visual
  const visualRe = /\s*\(\s*※\s*([^)]+?)\)\s*$/;
  const mv = s.match(visualRe);
  if (mv) {
    const instr = s.replace(visualRe, '').trim();
    return { instruction: instr, passageType:'visual', passage: mv[1].trim(), question:'' };
  }

  // 2) "다음 ~ 고르십시오. (지문...)" — 끝부분에 ( ... )
  const parenRe = /^(.+?(?:고르십시오|하십시오|쓰십시오|골라주십시오)\.)\s*\(([^)]+)\)\s*$/;
  const mp = s.match(parenRe);
  if (mp) {
    return { instruction: mp[1].trim(), passageType:'text', passage: mp[2].trim(), question:'' };
  }

  // 3) "다음 ~ 고르십시오. <지문>" — 마침표 뒤에 지문이 이어짐
  const splitRe = /^(.+?(?:고르십시오|하십시오|쓰십시오|골라주십시오)\.)\s+(.+)$/;
  const ms = s.match(splitRe);
  if (ms && ms[2].length > 1) {
    return { instruction: ms[1].trim(), passageType:'text', passage: ms[2].trim(), question:'' };
  }

  // 4) 빈칸이 있거나 짧은 한 줄 → inline (지문 박스에만 넣음)
  if (/빈칸/.test(s) || s.length < 100) {
    return { instruction:'', passageType:'inline', passage:s, question:'' };
  }

  // 5) 그 외 → 본문을 지문 박스에
  return { instruction:'', passageType:'text', passage:s, question:'' };
}

function renderPassageHTML(parsed) {
  if (!parsed || parsed.passageType === 'none') return '';
  if (parsed.passageType === 'visual') {
    const p = getPictogram(parsed.passage);
    return `<div class="passage-box visual">
      <div class="picto" aria-hidden="true">${p.emoji}</div>
      <div class="picto-label">${parsed.passage}</div>
    </div>`;
  }
  return `<div class="passage-box">${fmtQText(parsed.passage)}</div>`;
}

function renderQuizQ() {
  const q = S.quizQs[S.quizIdx];
  const total = S.quizQs.length;
  const isLast = S.quizIdx === total-1;
  document.getElementById('quiz-counter').textContent = `${S.quizIdx+1}/${total}`;
  document.getElementById('quiz-prog').style.width = `${(S.quizIdx+1)/total*100}%`;
  document.getElementById('quiz-next-btn').textContent = isLast ? t('diagSubmit') : t('diagNext');
  document.getElementById('quiz-next-btn').disabled = !S.quizAnswered;

  const catBadge = { vocabulary:'badge-blue', reading:'badge-green', listening:'badge-amber' }[q.cat] || 'badge-blue';
  const catLabel = { vocabulary:t('catVocab'), reading:t('catRead'), listening:t('catListen') }[q.cat];

  // 듣기는 대본 노출 X, 음성 카드만 표시
  let bodyHTML = `<span class="badge ${catBadge}">${catLabel}</span>`;
  if (q.cat === 'listening') {
    const audioText = q.script || q.audio || q.text || '';
    bodyHTML += `
      <p class="q-instruction">음성을 듣고 알맞은 답을 고르십시오.</p>
      <div class="passage-box" style="background:#FFF7ED;border-color:#FED7AA;display:flex;gap:10px;align-items:center;justify-content:center;">
        <button class="tts-btn" onclick="speakKo(\`${audioText.replace(/`/g,'').replace(/\\/g,'')}\`,false)">🔊 듣기</button>
        <button class="tts-btn" onclick="speakKo(\`${audioText.replace(/`/g,'').replace(/\\/g,'')}\`,true)">🐢 천천히</button>
      </div>
      <p class="q-helper">아래 보기에서 알맞은 것을 고르십시오.</p>`;
    bodyHTML += `<div id="quiz-choices">${renderQuizChoicesHTML()}</div><div id="quiz-expl"></div>`;
    document.getElementById('quiz-body').innerHTML = bodyHTML;
    if (audioText) setTimeout(()=>speakKo(audioText,false), 300);
    return;
  }

  // 읽기/어휘: 대질문 + 지문박스 + 보기
  const parsed = parseQuizText(q.text);
  if (parsed.instruction) bodyHTML += `<p class="q-instruction">${parsed.instruction}</p>`;
  bodyHTML += renderPassageHTML(parsed);
  bodyHTML += `<p class="q-helper">아래 보기에서 알맞은 것을 고르십시오.</p>`;
  bodyHTML += `<div id="quiz-choices">${renderQuizChoicesHTML()}</div><div id="quiz-expl"></div>`;
  document.getElementById('quiz-body').innerHTML = bodyHTML;
}

function renderQuizChoicesHTML() {
  const q = S.quizQs[S.quizIdx];
  return q.choices.map((c, i) => {
    let cls = '';
    if (S.quizAnswered) { cls = i === q.correct ? 'right' : i === S.quizSel ? 'wrong' : ''; }
    else if (i === S.quizSel) cls = 'sel';
    let icon;
    if (S.quizAnswered) {
      icon = i === q.correct ? 'O' : i === S.quizSel ? 'X' : (i+1);
    } else {
      icon = i+1;
    }
    let judgeBadge = '';
    if (S.quizAnswered) {
      if (i === q.correct) judgeBadge = '<span class="choice-judge j-right">정답</span>';
      else if (i === S.quizSel) judgeBadge = '<span class="choice-judge j-wrong">오답</span>';
    }
    return `<div class="choice ${cls}" onclick="${S.quizAnswered?'':'selectQuiz('+i+')'}" style="${S.quizAnswered?'cursor:default':''}">
      <div class="choice-num">${icon}</div>
      <div class="choice-text">${fmtQText(c)}</div>
      ${judgeBadge}
    </div>`;
  }).join('');
}

function selectQuiz(i) {
  if (S.quizAnswered) return;
  S.quizSel = i;
  S.quizAnswered = true;
  const q = S.quizQs[S.quizIdx];
  const correct = i === q.correct;
  if (correct) S.quizCorrect++;
  recordAnswer(q.id, correct);
  if (correct) { fireConfetti(); vibrate(40); }
  else { vibrate([50,30,50]); const cs = document.getElementById('quiz-choices'); if (cs) { cs.classList.remove('shake'); void cs.offsetWidth; cs.classList.add('shake'); } }

  document.getElementById('quiz-choices').innerHTML = renderQuizChoicesHTML();
  document.getElementById('quiz-next-btn').disabled = false;

  // Show explanation (빈 해설은 박스 자체를 그리지 않음)
  const explText = (q.explanation || '').trim();
  const hasKw = q.keywords && q.keywords.length > 0;
  const expEl = document.getElementById('quiz-expl');
  if (explText || hasKw) {
    const keywords = (q.keywords||[]).map(kw=>`<span class="keyword">${kw}</span>`).join(' ');
    expEl.innerHTML = `
      <div class="expl-box">
        <div class="expl-label">${correct?'✅':'❌'} ${t('expl')}</div>
        ${explText ? `<div class="expl-text">${explText.replace(/\n/g,'<br>')}</div>` : ''}
        ${hasKw ? `<div style="margin-top:10px;"><span style="font-size:11px;font-weight:700;color:var(--primary);letter-spacing:.3px;">${t('explKeyword')}</span><br><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;">${keywords}</div></div>` : ''}
      </div>
    `;
  } else {
    expEl.innerHTML = '';
  }
}

function quizNext() {
  S.quizAnswers.push(S.quizSel);
  if (S.quizIdx < S.quizQs.length-1) {
    S.quizIdx++;
    S.quizSel = null;
    S.quizAnswered = false;
    renderQuizQ();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const score = S.quizCorrect, total = S.quizQs.length;
  const pct = Math.round(score/total*100);
  const qs = S.quizQs;
  const catWrong = {}, catTotal = {};
  qs.forEach((q, i) => {
    catTotal[q.cat]=(catTotal[q.cat]||0)+1;
    if (S.quizAnswers[i] !== q.correct) catWrong[q.cat]=(catWrong[q.cat]||0)+1;
  });
  const weakAreas = Object.entries(catWrong).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([c])=>c);
  const r = { score, total, weakAreas, timestamp: Date.now(), type: 'practice', mockId: S.quizMockId || null };
  S.progress.push(r);
  persist();

  const color = scoreColor(pct);
  const emoji = pct>=80?'🎉':pct>=60?'👍':'💪';
  const title = pct>=80?t('sresGreat'):pct>=60?t('sresGood'):t('sresTry');

  document.getElementById('sres-body').innerHTML = `
    <div class="sres-emoji">${emoji}</div>
    <div class="sres-title">${title}</div>
    <div style="font-size:14px;color:var(--text2);margin-bottom:6px;font-weight:600;">${S.quizLabel || 'Practice'}</div>
    <div class="sres-score" style="color:${color}">${score} / ${total}</div>
    <div class="sres-sub">${pct}%</div>
    <button class="btn btn-primary" onclick="closeSheet()" style="margin-bottom:8px;">${t('sresReturn')}</button>
  `;
  document.getElementById('sres-overlay').classList.add('show');
}

function closeSheet() {
  document.getElementById('sres-overlay').classList.remove('show');
  // 모의고사에서 왔으면 practice 리스트로, 아니면 홈으로
  if (S.quizMockId) { goPractice(); }
  else { renderHome(); show('home'); }
}

// Exit confirm
function confirmExit() { document.getElementById('exit-overlay').classList.add('show'); }
function closeExit()   { document.getElementById('exit-overlay').classList.remove('show'); }
function doExit() {
  closeExit();
  if (S.quizOrigin === 'practice' || S.quizMockId) { goPractice(); }
  else { renderHome(); show('home'); }
}

function goReport() { renderReport(); show('report'); }

let _chartInst = null;

function renderReport() {
  const p = S.progress;
  if (!p.length) {
    document.getElementById('report-body').innerHTML = `
      <div style="text-align:center;padding:60px 20px;">
        <div style="font-size:44px;margin-bottom:14px;">📊</div>
        <p style="font-size:14px;color:var(--text2);line-height:1.7;">${t('reportEmpty')}</p>
      </div>`;
    return;
  }

  const total   = p.reduce((s,r)=>s+r.total,0);
  const avg     = Math.round(p.reduce((s,r)=>s+r.score/r.total*100,0)/p.length);
  const correct = p.reduce((s,r)=>s+r.score,0);
  const practice = p.filter(r=>r.type==='practice');

  const catWrong={}, catCount={};
  p.forEach(r=>r.weakAreas.forEach(w=>{ catWrong[w]=(catWrong[w]||0)+1; catCount[w]=(catCount[w]||0)+1; }));

  const catLabel = { vocabulary:t('catVocab'), reading:t('catRead'), listening:t('catListen') };

  document.getElementById('report-body').innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-val" style="color:var(--primary)">${total}</div><div class="stat-lbl">Total</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--green)">${avg}%</div><div class="stat-lbl">Average</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--amber)">${p.length}</div><div class="stat-lbl">Sessions</div></div>
    </div>

    ${practice.length >= 2 ? `
    <div class="card">
      <div class="card-title">${t('reportTrend')}</div>
      <div class="chart-wrap"><canvas id="rep-chart"></canvas></div>
    </div>` : ''}

    <div class="card">
      <div class="card-title">${t('reportWeak')}</div>
      ${Object.keys(catWrong).length ? Object.entries(catWrong).map(([cat,w])=>{
        const ratio = Math.min(Math.round(w/p.length*100),100);
        return `<div class="weak-row">
          <div class="weak-header"><span>${catLabel[cat]||cat}</span><span class="weak-pct">${ratio}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${ratio}%;background:var(--red)"></div></div>
        </div>`;
      }).join('') : `<p style="color:var(--green);font-size:13px;">${t('noWeak')}</p>`}
    </div>

    <div class="card">
      <div class="card-title">${t('reportHistory')}</div>
      ${p.slice().reverse().slice(0,6).map(r=>{
        const pct=Math.round(r.score/r.total*100);
        const col=scoreColor(pct);
        const bg=pct>=70?'var(--green-light)':pct>=50?'var(--amber-light)':'var(--red-light)';
        const d=new Date(r.timestamp);
        const lbl=r.type==='diagnosis'?t('diagType'):t('pracType');
        return `<div class="hist-item">
          <div class="hist-score" style="background:${bg};color:${col}">${pct}%</div>
          <div class="hist-info"><div class="hist-title">${lbl}</div><div class="hist-sub">${r.score}/${r.total}</div></div>
          <div class="hist-date">${d.getMonth()+1}/${d.getDate()}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="pad-bottom"></div>
  `;

  if (practice.length >= 2) {
    setTimeout(() => {
      const ctx = document.getElementById('rep-chart');
      if (!ctx) return;
      if (_chartInst) { _chartInst.destroy(); _chartInst = null; }
      _chartInst = new Chart(ctx, {
        type: 'line',
        data: {
          labels: practice.map((_,i)=>`#${i+1}`),
          datasets: [{
            data: practice.map(r=>Math.round(r.score/r.total*100)),
            borderColor: '#1A56DB', backgroundColor: 'rgba(26,86,219,0.07)',
            borderWidth: 2.5, pointRadius: 5, tension: 0.35, fill: true,
            pointBackgroundColor:'#1A56DB', pointBorderColor:'#fff', pointBorderWidth:2,
          }]
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false} },
          scales:{
            y:{min:0,max:100,grid:{color:'rgba(0,0,0,0.04)'},ticks:{stepSize:25,font:{size:10}}},
            x:{grid:{display:false},ticks:{font:{size:10}}}
          }
        }
      });
    }, 60);
  }
} // end renderReport

function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getTodayWords() {
  const key = getTodayKey();
  // Deterministic daily selection: use date as seed offset
  const d = new Date();
  const seed = d.getDate() + d.getMonth() * 31;
  const shuffleSeeded = (arr, s) => {
    const a = [...arr]; let cur = s % a.length;
    for (let i = a.length - 1; i > 0; i--) {
      const j = (cur + i * 7) % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  return shuffleSeeded(VOCAB_ALL, seed).slice(0, 10);
}

function getVocabDoneSet() {
  try { return new Set(JSON.parse(localStorage.getItem('seouleps_vocab_done') || '[]')); }
  catch(e) { return new Set(); }
}

function saveVocabDone(set) {
  try { localStorage.setItem('seouleps_vocab_done', JSON.stringify([...set])); } catch(e) {}
}

function markWordDone(wordId) {
  const done = getVocabDoneSet();
  done.add(wordId);
  saveVocabDone(done);
}

function unmarkWordDone(wordId) {
  const done = getVocabDoneSet();
  done.delete(wordId);
  saveVocabDone(done);
}

let _vocabTab = 'today';

function goVocab() {
  _vocabTab = 'today';
  renderVocabScreen();
  show('vocab');
}

function switchVocabTab(tab) {
  _vocabTab = tab;
  document.querySelectorAll('.vocab-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('vtab-' + tab).classList.add('active');
  // 탭 전환 시 뒤집혀있던 카드 리셋
  document.querySelectorAll('.flip-card-wrap.flipped').forEach(w => w.classList.remove('flipped'));
  if (tab === 'list') S.listIdx = 0;
  renderVocabBody();
}

function renderVocabScreen() {
  // date label (존재할 때만)
  const dateLbl = document.getElementById('vocab-date-lbl');
  if (dateLbl) {
    const d = new Date();
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    dateLbl.textContent = `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  }

  // tabs
  document.querySelectorAll('.vocab-tab').forEach(t => t.classList.remove('active'));
  const todayTab = document.getElementById('vtab-today');
  if (todayTab) todayTab.classList.add('active');
  _vocabTab = 'today';

  renderVocabBody();
}

function renderVocabBody() {
  if (_vocabTab === 'today') renderTodayWords();
  else renderVocabList();
}

// AUDIO / SPEECH
// ════════════════════════════════════════════════════════
function playWord(wid, krText, roman) {
  const btn = document.getElementById('wlisten-' + wid);
  if (!btn) return;

  // Use Web Speech API (TTS)
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(krText);
    utt.lang = 'ko-KR'; utt.rate = 0.85; utt.pitch = 1;

    btn.classList.add('playing');
    btn.textContent = '▶ 재생 중...';

    utt.onend = () => {
      btn.classList.remove('playing');
      btn.innerHTML = '🔊 듣기';
    };
    utt.onerror = () => {
      btn.classList.remove('playing');
      btn.innerHTML = '🔊 듣기';
    };
    window.speechSynthesis.speak(utt);
  } else {
    // fallback: show phonetic
    btn.textContent = `[ ${roman} ]`;
    setTimeout(() => { btn.innerHTML = '🔊 듣기'; }, 1800);
  }
}

function repeatWord(wid, krText, roman) {
  // Visual countdown → then TTS slow
  const btn = document.getElementById('wcard-' + wid)?.querySelector('.word-btn-repeat');
  if (!btn) return;

  let count = 3;
  btn.textContent = count;
  btn.style.background = 'var(--primary-light)';
  btn.style.borderColor = 'var(--primary)';
  btn.style.color = 'var(--primary)';
  btn.style.fontSize = '16px';
  btn.style.fontWeight = '800';

  const tick = setInterval(() => {
    count--;
    if (count > 0) { btn.textContent = count; }
    else {
      clearInterval(tick);
      btn.textContent = '🗣️';
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
      btn.style.fontSize = '';
      btn.style.fontWeight = '';
      // play slow for user to follow
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(krText);
        utt.lang = 'ko-KR'; utt.rate = 0.65; utt.pitch = 1;
        window.speechSynthesis.speak(utt);
      }
    }
  }, 700);
}

function toggleWordDone(wid, idx) {
  const done = getVocabDoneSet();
  const wasDone = done.has(wid);

  if (wasDone) {
    done.delete(wid);
  } else {
    done.add(wid);
  }
  saveVocabDone(done);

  // Animate card
  const card = document.getElementById('wcard-' + wid);
  const doneBtn = document.getElementById('wdone-' + wid);
  const krEl = card?.querySelector('.word-korean');

  if (!wasDone) {
    card?.classList.add('done', 'flash-done');
    doneBtn && (doneBtn.textContent = '✓ 외웠어요') && doneBtn.classList.add('done-state');
    krEl?.classList.add('done-text');
    setTimeout(() => card?.classList.remove('flash-done'), 400);
  } else {
    card?.classList.remove('done');
    doneBtn && (doneBtn.textContent = '외웠어요') && doneBtn.classList.remove('done-state');
    krEl?.classList.remove('done-text');
  }

  // Celebration if all done
  const words = getTodayWords();
  const newDone = getVocabDoneSet();
  const doneCount = words.filter(w => newDone.has(w.id)).length;
  if (doneCount === words.length) {
    setTimeout(() => showAllDoneSheet(), 300);
  }
}

// 전체 단어장 캐러셀 컨트롤
function listUpdateUI() {
  const words = S._listWords || [];
  const idx = S.listIdx || 0;
  const total = words.length;
  const inner = document.querySelector('#list-track .today-track-inner') || document.getElementById('list-track');
  // inner slide
  const track = document.getElementById('list-track');
  if (track) {
    let innerEl = track.querySelector('.today-track-inner');
    if (!innerEl) {
      // wrap slides in inner div if not already
      const slides = Array.from(track.children);
      innerEl = document.createElement('div');
      innerEl.className = 'today-track-inner';
      slides.forEach(s => innerEl.appendChild(s));
      track.appendChild(innerEl);
    }
    innerEl.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1)';
    innerEl.style.transform = `translateX(-${idx * 100}%)`;
  }
  const ct = document.getElementById('list-counter-text');
  if (ct) ct.textContent = `${idx+1} / ${total}`;
  const _pfill = document.getElementById('list-progress-fill');
  if (_pfill && total > 0) _pfill.style.width = (((idx+1)/total)*100).toFixed(1) + '%';
  // ─ 슬라이드 이동 전: 비활성 카드의 flip 즉시 reset (transition 없이) ─
  document.querySelectorAll('#list-track .flip-card-wrap').forEach((w, i) => {
    if (i !== idx && w.classList.contains('flipped')) {
      w.classList.add('no-flip-anim');
      w.classList.remove('flipped');
      void w.offsetWidth;
      requestAnimationFrame(() => w.classList.remove('no-flip-anim'));
    }
  });
}
function listPrev() { if ((S.listIdx||0) > 0) { S.listIdx--; listUpdateUI(); } }
function listNext() { const t=(S._listWords||[]).length; if ((S.listIdx||0) < t-1) { S.listIdx++; listUpdateUI(); } }
function listGoTo(i) { S.listIdx = i; listUpdateUI(); }

function attachListSwipe() {
  const track = document.getElementById('list-track');
  if (!track) return;
  let startX=0, startY=0, deltaX=0, dragging=false, axis=null, _isDragged=false;
  const onStart = (x,y) => { startX=x; startY=y; deltaX=0; dragging=true; axis=null; _isDragged=false; };
  const onMove = (x,y) => {
    if (!dragging) return;
    const dx=x-startX, dy=y-startY;
    if (axis===null) {
      if (Math.abs(dx)>6||Math.abs(dy)>6) axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      else return;
    }
    if (axis==='y') return;
    deltaX=dx;
    if (Math.abs(deltaX)>8) _isDragged=true;
    const inner=track.querySelector('.today-track-inner');
    const total=(S._listWords||[]).length;
    const idx=S.listIdx||0;
    let pct=(deltaX/track.offsetWidth)*100;
    if ((idx===0&&pct>0)||(idx===total-1&&pct<0)) pct=pct*0.3;
    if (inner) inner.style.transform=`translateX(calc(-${idx*100}% + ${pct}%))`;
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging=false;
    if (axis==='x'&&Math.abs(deltaX)>50) { if (deltaX<0) listNext(); else listPrev(); }
    else listUpdateUI();
    axis=null; deltaX=0;
    setTimeout(()=>{ _isDragged=false; }, 50);
  };
  track.ontouchstart = e=>onStart(e.touches[0].clientX,e.touches[0].clientY);
  track.ontouchmove  = e=>{ e.preventDefault(); onMove(e.touches[0].clientX,e.touches[0].clientY); };
  track.ontouchend   = onEnd;
  track.onmousedown  = e=>{ onStart(e.clientX,e.clientY); e.preventDefault(); };
  track.onmousemove  = e=>{ if(dragging) onMove(e.clientX,e.clientY); };
  track.onmouseup    = onEnd;
  track.onmouseleave = onEnd;
  track.querySelectorAll('.flip-card-wrap').forEach(wrap=>{
    wrap.addEventListener('click',(e)=>{
      if (!S.flipMode) return;
      if (_isDragged) return;
      if (e.target.closest('button')) return;
      const slide = wrap.closest('.today-slide');
      const idxAttr = slide && slide.getAttribute('data-idx');
      if (idxAttr !== null && parseInt(idxAttr, 10) !== (S.listIdx || 0)) return;
      wrap.classList.toggle('flipped');
    });
  });
}

function greetByHour() {
  const h = new Date().getHours();
  if (h < 6) return '🌙 좋은 새벽이에요';
  if (h < 12) return '🌤 좋은 아침이에요';
  if (h < 18) return '☀️ 좋은 오후예요';
  return '🌆 좋은 저녁이에요';
}
function todayLabel() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function computeStreak() {
  const p = S.progress || [];
  if (!p.length) return 0;
  const days = new Set();
  p.forEach(r => {
    const d = new Date(r.timestamp);
    days.add(`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`);
  });
  let streak = 0;
  const cur = new Date();
  for (let i = 0; i < 365; i++) {
    const k = `${cur.getFullYear()}-${cur.getMonth()}-${cur.getDate()}`;
    if (days.has(k)) { streak++; cur.setDate(cur.getDate()-1); }
    else if (i === 0) { cur.setDate(cur.getDate()-1); }
    else break;
  }
  // ensure at least 1 if user has activity today
  return Math.max(streak, days.size > 0 ? 1 : 0);
}
function computePassPredict(avg, total) {
  if (total < 5) return Math.max(20, avg - 5);
  if (avg >= 75) return Math.min(95, avg + 8);
  if (avg >= 60) return avg + 3;
  return Math.max(15, avg - 5);
}
function countTodayQuiz() {
  const today = new Date(); today.setHours(0,0,0,0);
  return (S.progress||[]).filter(r => new Date(r.timestamp) >= today).reduce((s,r) => s + r.total, 0);
}
function countTodayWords() {
  const today = new Date(); today.setHours(0,0,0,0);
  const learned = S.vocab?.learned || {};
  return Object.values(learned).filter(t => new Date(t) >= today).length;
}
function pickWordOfDay() {
  if (!Array.isArray(VOCAB_ALL) || !VOCAB_ALL.length) return null;
  const seed = new Date().getDate() + new Date().getMonth()*31;
  return VOCAB_ALL[seed % VOCAB_ALL.length];
}

    u.pitch = 1;

        <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:4px;">📋 사용 안내</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.6;">
          엑셀에서 CSV(UTF-8)로 저장한 후 아래 영역에 드래그하거나 클릭해서 업로드하세요.<br>
          템플릿을 받아 그대로 채우면 가장 안전합니다.
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:14px;">
        <button class="btn btn-outline" style="flex:1;padding:10px;font-size:13px;" onclick="downloadTemplate('q')">📋 문제 템플릿</button>
        <button class="btn btn-outline" style="flex:1;padding:10px;font-size:13px;" onclick="downloadTemplate('w')">📋 단어 템플릿</button>
      </div>

      <div style="font-size:13px;font-weight:700;color:var(--navy);margin:14px 0 8px;">📝 문제 업로드</div>
      <div class="upload-zone" id="uz-q" onclick="document.getElementById('file-q').click()">
        <div class="upload-zone-icon">📤</div>
        <div class="upload-zone-text">CSV 파일 끌어놓기 / 클릭</div>
        <div class="upload-zone-sub">컬럼: id,cat,diff,text,c1,c2,c3,c4,correct,explanation,audio</div>
      </div>
      <input type="file" id="file-q" accept=".csv,.txt" style="display:none;" onchange="handleUpload(event,'q')"/>
      <div id="result-q"></div>

      <div style="font-size:13px;font-weight:700;color:var(--navy);margin:18px 0 8px;">📒 단어 업로드</div>
      <div class="upload-zone" id="uz-w" onclick="document.getElementById('file-w').click()">
        <div class="upload-zone-icon">📤</div>
        <div class="upload-zone-text">CSV 파일 끌어놓기 / 클릭</div>
        <div class="upload-zone-sub">컬럼: ko,en,vi,example,category</div>
      </div>
      <input type="file" id="file-w" accept=".csv,.txt" style="display:none;" onchange="handleUpload(event,'w')"/>
      <div id="result-w"></div>

      <div class="upload-stat-row">
        <div class="upload-stat-card"><div class="upload-stat-val">${customQ}</div><div class="upload-stat-lbl">업로드된 문제</div></div>
        <div class="upload-stat-card"><div class="upload-stat-val">${customW}</div><div class="upload-stat-lbl">업로드된 단어</div></div>
      </div>

      <button class="btn btn-outline" style="width:100%;margin-top:14px;color:var(--red);border-color:var(--red);" onclick="clearCustomContent()">
        🗑 업로드 콘텐츠 초기화
      </button>

  `;
  // Setup drag-drop
  ['q','w'].forEach(k => {
    const zone = document.getElementById('uz-'+k);
    if (!zone) return;
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) processCsv(file, k);
    });
  });
}

function handleUpload(e, kind) {
  const file = e.target.files[0];
  if (file) processCsv(file, kind);
}

function processCsv(file, kind) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const rows = parseCsv(e.target.result);
      if (!rows.length) throw new Error('빈 파일입니다');
      const header = rows[0].map(h => h.trim().toLowerCase());
      const items = [];
      let errors = 0;
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (!r.length || r.every(c => !c)) continue;
        const obj = {};
        header.forEach((h, idx) => obj[h] = (r[idx]||'').trim());
        if (kind === 'q') {
          if (!obj.text || !obj.c1 || !obj.c2 || obj.correct === undefined || obj.correct === '') { errors++; continue; }
          items.push({
            id: obj.id || ('u' + Date.now() + '_' + i),
            cat: obj.cat || 'vocabulary',
            diff: parseInt(obj.diff||'1', 10),
            text: obj.text,
            choices: [obj.c1,obj.c2,obj.c3,obj.c4].filter(c=>c),
            correct: parseInt(obj.correct, 10),
            explanation: obj.explanation || '',
            audio: obj.audio || ''
          });
        } else {
          if (!obj.ko || !obj.en) { errors++; continue; }
          items.push({
            ko: obj.ko, en: obj.en, vi: obj.vi||'', example: obj.example||'', category: obj.category||'general'
          });
        }
      }
      S.customContent = S.customContent || {questions:[],words:[]};
      const arr = kind==='q' ? S.customContent.questions : S.customContent.words;
      items.forEach(it => arr.push(it));
      saveState();
      const target = document.getElementById('result-'+kind);
      target.innerHTML = `<div class="upload-result">✅ ${items.length}개 추가됨${errors?` · ${errors}개 오류`:''}</div>`;
      setTimeout(renderAdmin, 1500);
    } catch (err) {
      document.getElementById('result-'+kind).innerHTML = `<div class="upload-result error">❌ ${err.message}</div>`;
    }
  };
  reader.readAsText(file, 'utf-8');
}

function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false;
      else cell += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (cell || row.length) { row.push(cell); rows.push(row); row = []; cell = ''; }
        if (c === '\r' && text[i+1] === '\n') i++;
      } else cell += c;
    }
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function downloadTemplate(kind) {
  const txt = kind === 'q'
    ? 'id,cat,diff,text,c1,c2,c3,c4,correct,explanation,audio\nv100,vocabulary,1,"빈칸에 알맞은 말은?",커피,밥,책,공,0,"마시다는 ~",\nl100,listening,2,"다음을 듣고 답하세요",고맙습니다,미안해요,안녕하세요,잘 가요,0,"감사 표현","감사합니다"\n'
    : 'ko,en,vi,example,category\n맛이 좋다,to be tasty,ngon,"이 음식은 맛이 좋아요.",food\n안녕하세요,hello,xin chào,"안녕하세요. 만나서 반가워요.",greeting\n';
  const blob = new Blob(['\uFEFF' + txt], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `seoul-eps-${kind==='q'?'questions':'words'}-template.csv`;
  a.click(); URL.revokeObjectURL(url);
}

function clearCustomContent() {
  if (confirm('업로드한 콘텐츠를 모두 삭제하시겠습니까?')) {
    S.customContent = {questions:[], words:[]};
    saveState();
    renderAdmin();
  }
}

// ════════════════════════════════════════════════════════
// TODAY CAROUSEL + FLIP MODE
// ════════════════════════════════════════════════════════
function applyTodayMode() {
  const ftb = document.getElementById('flip-toggle-bar');
  if (ftb) {
    if (S.flipMode) ftb.classList.add('is-on');
    else ftb.classList.remove('is-on');
  }
  const sw = document.getElementById('ftb-switch');
  if (sw) sw.setAttribute('aria-checked', S.flipMode ? 'true' : 'false');
  const st = document.getElementById('ftb-state');
  if (st) st.textContent = S.flipMode ? 'ON' : 'OFF';
  const sub = document.getElementById('ftb-sub');
  if (sub) sub.textContent = S.flipMode ? '카드를 탭하면 뜻이 보여요' : '한국어만 보고 뜻을 떠올려보세요';
  const hint = document.getElementById('today-hint');
  if (hint) hint.textContent = S.flipMode ? '탭해서 뜻 확인 · 좌우로 넘기기' : '좌우로 밀어서 단어를 넘겨보세요';
}

function toggleFlipMode() {
  S.flipMode = !S.flipMode;
  document.querySelectorAll('.flip-card-wrap.flipped').forEach(w => w.classList.remove('flipped'));
  if (typeof _vocabTab !== 'undefined' && _vocabTab === 'list') {
    renderVocabList();
  } else {
    renderTodayWords();
  }
  applyTodayMode();
}

function todayUpdateUI() {
  const total = (S._todayWords || []).length;
  if (!total) return;
  const idx = S.todayIdx || 0;
  // Counter
  const ct = document.getElementById('today-counter-text');
  if (ct) ct.textContent = `${idx+1} / ${total}`;
  // ─ 슬라이드 이동 전: 비활성 카드의 flip 즉시 reset (transition 없이) ─
  document.querySelectorAll('#today-track .flip-card-wrap').forEach((w, i) => {
    if (i !== idx && w.classList.contains('flipped')) {
      w.classList.add('no-flip-anim');
      w.classList.remove('flipped');
      void w.offsetWidth;
      requestAnimationFrame(() => w.classList.remove('no-flip-anim'));
    }
  });
  // Track translate
  const track = document.getElementById('today-track');
  if (track) {
    if (!track.querySelector('.today-track-inner')) {
      const slides = Array.from(track.children);
      const inner = document.createElement('div');
      inner.className = 'today-track-inner';
      slides.forEach(s => inner.appendChild(s));
      track.appendChild(inner);
    }
    const inner = track.querySelector('.today-track-inner');
    inner.style.transform = `translateX(-${idx * 100}%)`;
  }
  // Dots
  const done = getVocabDoneSet();
  document.querySelectorAll('.today-dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx);
    d.classList.toggle('done', done.has(S._todayWords[i].id));
  });
  // Arrows
  const prev = document.getElementById('today-prev');
  const next = document.getElementById('today-next');
  if (prev) prev.disabled = idx === 0;
  if (next) next.disabled = idx === total - 1;
}

function todayPrev() {
  if ((S.todayIdx || 0) > 0) { S.todayIdx--; todayUpdateUI(); }
}
function todayNext() {
  const total = (S._todayWords || []).length;
  if ((S.todayIdx || 0) < total - 1) { S.todayIdx++; todayUpdateUI(); }
}
function todayGoTo(i) {
  S.todayIdx = i; todayUpdateUI();
}

function attachTodaySwipe() {
  const track = document.getElementById('today-track');
  if (!track) return;
  let startX=0, startY=0, deltaX=0, dragging=false, axis=null, _isDragged=false, _startTime=0;

  const onStart = (x,y) => {
    startX=x; startY=y; deltaX=0;
    dragging=true; axis=null; _isDragged=false; _startTime=Date.now();
    track.classList.add('dragging');
  };
  const onMove = (x,y) => {
    if (!dragging) return;
    const dx=x-startX, dy=y-startY;
    if (axis===null) {
      if (Math.abs(dx)>5||Math.abs(dy)>5) axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      else return;
    }
    if (axis==='y') return;
    deltaX=dx;
    if (Math.abs(deltaX)>10) _isDragged=true;
    const inner=track.querySelector('.today-track-inner');
    const total=(S._todayWords||[]).length;
    const idx=S.todayIdx||0;
    let pct=(deltaX/track.offsetWidth)*100;
    if ((idx===0&&pct>0)||(idx===total-1&&pct<0)) pct*=0.3;
    if (inner) inner.style.transform=`translateX(calc(-${idx*100}% + ${pct}%))`;
  };
  const onEnd = (endTarget) => {
    if (!dragging) return;
    track.classList.remove('dragging');
    dragging=false;
    if (axis==='x' && Math.abs(deltaX)>50) {
      deltaX<0 ? todayNext() : todayPrev();
    } else {
      const isTap = !_isDragged && (Date.now()-_startTime)<350;
      todayUpdateUI();
      if (isTap && S.flipMode && endTarget) {
        const wrap = endTarget.closest('.flip-card-wrap');
        if (wrap && !endTarget.closest('button')) {
          const slide=wrap.closest('.today-slide');
          const si=slide&&parseInt(slide.getAttribute('data-idx'),10);
          if (si===(S.todayIdx||0)) wrap.classList.toggle('flipped');
        }
      }
    }
    axis=null; deltaX=0; _isDragged=false;
  };

  track.ontouchstart = e => onStart(e.touches[0].clientX, e.touches[0].clientY);
  track.ontouchmove  = e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); };
  track.ontouchend   = e => onEnd(document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
  // mousedown에 preventDefault 없음 → click 이벤트 정상 발생
  track.onmousedown  = e => onStart(e.clientX, e.clientY);
  track.onmousemove  = e => { if (dragging) onMove(e.clientX, e.clientY); };
  track.onmouseup    = e => onEnd(e.target);
  track.onmouseleave = () => {
    if (!dragging) return;
    track.classList.remove('dragging');
    dragging=false; axis=null; deltaX=0; _isDragged=false;
    todayUpdateUI();
  };
}
